[project]
name = "fastart"
version = "0.1.0"
description = "Distill-style interactive ML explainers — FastHTML demo site + CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Predictive Labs AI" }]
keywords = ["attention", "transformers", "explainability", "fasthtml", "education"]
dependencies = [
  "numpy>=1.26",
  "python-fasthtml>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fastart = "fastart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastart"]

[tool.uv]
package = true
